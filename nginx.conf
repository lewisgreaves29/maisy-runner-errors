server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check probe
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Intercept any status code requested by Traefik
    location ~ ^/(404|500|502|503|504)$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets immutable caching
    location ~* \.(?:css|js|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
