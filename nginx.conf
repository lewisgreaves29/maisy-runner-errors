server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check probe
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Internal error page handler
    location = /index.html {
        internal;
    }

    # Intercept any status code requested by Traefik ErrorMiddleware
    location ~ ^/(404|500|502|503|504)$ {
        try_files /index.html =404;
    }

    # Catch-all for unmapped hostnames/paths: return HTTP 404 with Maisy Runner
    location / {
        error_page 404 /index.html;
        return 404;
    }

    # Static assets immutable caching
    location ~* \.(?:css|js|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
