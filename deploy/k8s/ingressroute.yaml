apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maisy-catch-all
  namespace: kube-system
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: maisy-error-service
          port: 80
